name: Build & Package iOS App (IPA)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build & Package Unsigned IPA
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: |
          xcrun xcodebuild -version

      - name: Build & Archive iOS App
        run: |
          xcodebuild \
            -project YumikoToysRR.xcodeproj \
            -scheme YumikoToysRR \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/YumikoToysRR.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package Unsigned IPA (with Live Activity Appex)
        run: |
          mkdir -p build/Payload
          cp -r build/YumikoToysRR.xcarchive/Products/Applications/YumikoToysRR.app build/Payload/
          cd build && zip -qry YumikoToysRR-unsigned.ipa Payload
          ls -lh YumikoToysRR-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YumikoToysRR-iOS-IPA
          path: build/YumikoToysRR-unsigned.ipa
          retention-days: 14

      - name: Create Release and Upload IPA
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 🐰 YumikoToysRR for NIO (iOS) ${{ github.ref_name }}
          files: build/YumikoToysRR-unsigned.ipa
          generate_release_notes: false
          body: |
          body: |
            ## 🌸 YumikoToysRR for NIO (iOS) ${{ github.ref_name }} 全景车况里程碑更新

            ### 🚀 27 大全景车况系统 100% 完整移植
            - **⚡️ 高压快充详情大屏**：实时充电功率（kW）、充电电流（A）、充电电压（V）、目标限充百分比、充满预估时间倒计时、充电桩类型自动辨识。
            - **🪟 车窗与全景天幕透视**：4 门车窗独立开度百分比（0-100% 动态能量条）、全景天窗天幕开度、后视镜折叠状态。
            - **🚗 驾驶模式与行车泊车全景**：舒适/节能/运动/运动+/个性化/雪地/沙地/湿地模式、实时车速、P/D/R 挡位、遥控泊车辅助（RPA）与行程分享。
            - **🔑 智能钥匙与 12V 辅助小电瓶**：12V 电瓶真实电压（如 `12.8V 优良`）、电瓶健康度评级、蓝牙靠近感应、感应门把手伸出。
            - **🧊 车载智能冰箱与空气健康**：车载冰箱电源与当前/目标温度、PM2.5 车内外空气质量检测。
            - **📦 储物空间与行李箱状态**：前机舱盖/前备箱开闭、电动尾门/后备箱开闭、中控密码手套箱上锁。
            - **💡 车外灯光与照明系统**：近光灯、远光灯、示宽灯、双闪危险警报灯拟物化语义展示。
            - **📑 换电站足迹与财务大屏**：累计换电次数、总花费支出、常用换电站 Top 排行榜、历史服务与换电工单手风琴明细展开。
            - **🗺️ 行车轨迹地图与回放**：历史行驶轨迹连线渲染、起点终点标记、行驶距离统计与时间轴回放。
            - **📈 能耗达成率与多维趋势图表**：百公里电耗评分、每日里程增量柱状图、电池容量衰减健康曲线。
            - **📜 抓包请求与运行日志**：请求历史列表、URL、状态码、响应耗时（ms）、一键复制 cURL/JSON。
            - **🔍 底层 JSON 实时检视**：每张卡片右上角配备 `{ }` 按钮，一键弹出查看底层 RVS 数据结构并支持一键复制。

            ### 💾 7 大高级状态字段智能持久化继承
            - **本地多块缓存落盘**：`cached-tyre.json`、`cached-lv-batt.json`、`cached-key.json`、`cached-heating.json`、`cached-window.json`、`cached-frdg.json`、`cached-box.json`、`cached-light.json`。
            - **双引擎协同**：Shadowrocket 抓包捕获全量 RVS 数据并自动落盘；Widget 动态计算签名永不过期日常轮询并无缝继承高级字段，彻底杜绝数据空白与丢失。

            ### 📱 安装说明
            - 下载下方附件 `YumikoToysRR-unsigned.ipa`；
            - 使用 TrollStore（巨魔商店）、Sideloadly、AltStore 或自签名证书安装即可直接使用；
            - 内置灵动岛与锁屏实时活动组件 (`WheaterStatusExtension.appex`)。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
