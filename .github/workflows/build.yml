name: Build & Package iOS App (IPA)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build & Package Unsigned IPA
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: |
          xcrun xcodebuild -version

      - name: Build & Archive iOS App
        run: |
          xcodebuild \
            -project YumikoToysRR.xcodeproj \
            -scheme YumikoToysRR \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/YumikoToysRR.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package Unsigned IPA (with Live Activity Appex)
        run: |
          mkdir -p build/Payload
          cp -r build/YumikoToysRR.xcarchive/Products/Applications/YumikoToysRR.app build/Payload/
          cd build && zip -qry YumikoToysRR-unsigned.ipa Payload
          ls -lh YumikoToysRR-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YumikoToysRR-iOS-IPA
          path: build/YumikoToysRR-unsigned.ipa
          retention-days: 14

      - name: Create Release and Upload IPA
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/YumikoToysRR-unsigned.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
